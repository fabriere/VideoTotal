appId: com.videototal.app
productName: VideoTotal
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!changelogs/*'
asarUnpack:
  - resources/**
# The 'noutube' scheme is kept intentionally: it is the wire contract shared with
# desktop/src/main/lib/deeplink.ts and app.config.ts. Rename all three together.
protocols:
  - name: VideoTotal
    schemes:
      - noutube
win:
  executableName: videototal
nsis:
  artifactName: ${productName}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}
linux:
  executableName: videototal
  executableArgs:
    - --ozone-platform=x11
  target:
    - AppImage
    - snap
  maintainer: VideoTotal
  category: Utility
appImage:
  artifactName: ${productName}-${version}.${ext}
snap:
  artifactName: videototal_${version}_${arch}.${ext}
npmRebuild: false
# Use the Electron runtime already unpacked by the `electron` package instead of
# letting electron-builder download the matching zip. This host denies
# electron-builder's artifact download lock (EPERM on mkdir of
# eb-dl-<hash>.lock.lock in the temp dir) and this option skips that path
# entirely; the directory below is a complete Electron 43.4.1 win32-x64 dist.
electronDist: C:/Users/Admin/Documents/deepseek-harness/default-workspace/NouTube/node_modules/electron/dist
# No `publish` block on purpose. The upstream config published to
# github:nonbili/NouTube-Desktop, which would make this build silently
# auto-update itself into Nonbili's official release. Auto-update stays off
# until an own release channel is configured.
