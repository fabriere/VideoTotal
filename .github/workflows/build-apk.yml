name: Build Android APK

# Compilación gratuita del APK, sin depender de la cuota de EAS.
#
# Replica lo que hacía EAS: bun install -> bun bundle (el script que se inyecta
# en la WebView de YouTube) -> expo prebuild -> Gradle. La firma se aplica al
# final con apksigner y la misma clave que usa EAS, que vive en los secretos del
# repositorio (VIDEOTOTAL_KEYSTORE_*).
#
# Se dispara a mano desde la pestaña Actions -> "Run workflow".

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # La dirección de la API se incrusta en el JS en el momento de empaquetar.
      EXPO_PUBLIC_VIDEOTOTAL_API: https://api-production-0cd81.up.railway.app
      # Sólo se compila arm64: es lo que se distribuye y ahorra tiempo y espacio.
      ORG_GRADLE_PROJECT_reactNativeArchitectures: arm64-v8a

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Link local package
        run: bun link

      - name: Install dependencies
        run: bun install

      - name: Build content script
        run: bun bundle

      - name: Prebuild Android
        run: bunx expo prebuild --platform android --no-install

      - name: Accept Android SDK licenses
        run: |
          if [ -d "$ANDROID_HOME/cmdline-tools" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          fi

      - name: Read app version
        run: echo "APP_VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_ENV

      - name: Assemble full release
        working-directory: android
        run: ./gradlew :app:assembleFullRelease --no-daemon

      - name: Sign the arm64 APK
        env:
          VIDEOTOTAL_KEYSTORE_PASSWORD: ${{ secrets.VIDEOTOTAL_KEYSTORE_PASSWORD }}
          VIDEOTOTAL_KEY_PASSWORD: ${{ secrets.VIDEOTOTAL_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          echo "${{ secrets.VIDEOTOTAL_KEYSTORE_BASE64 }}" | base64 -d > videototal-release.jks
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          echo "apksigner: $APKSIGNER"
          find android/app/build/outputs/apk -name '*.apk' || true
          UNSIGNED=$(find android/app/build/outputs/apk -name 'app-full-arm64-v8a-release*.apk' | head -1)
          echo "unsigned: $UNSIGNED"
          "$APKSIGNER" sign \
            --ks videototal-release.jks \
            --ks-pass "env:VIDEOTOTAL_KEYSTORE_PASSWORD" \
            --key-pass "env:VIDEOTOTAL_KEY_PASSWORD" \
            --ks-key-alias "${{ secrets.VIDEOTOTAL_KEY_ALIAS }}" \
            --out "VideoTotal-${APP_VERSION}-arm64.apk" \
            "$UNSIGNED"
          "$APKSIGNER" verify --print-certs "VideoTotal-${APP_VERSION}-arm64.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VideoTotal-${{ env.APP_VERSION }}-arm64
          path: VideoTotal-${{ env.APP_VERSION }}-arm64.apk
